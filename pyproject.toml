[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-engine"
version = "0.1.0"
description = "A minimal SubjectState persistence engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
continuity-engine = "continuity_engine.cli:main"
continuity-frontend = "continuity_engine.frontend.__main__:main"

[tool.setuptools.package-data]
continuity_engine = ["frontend/*.html", "frontend/*.css", "frontend/*.js"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
